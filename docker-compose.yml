services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: hicommit
    ports:
      - "3306:3306"
    volumes:
      - hicommit_db_data:/var/lib/mysql
      - ./docker/mariadb/hicommit.cnf:/etc/mysql/conf.d/hicommit.cnf:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  server:
    build:
      context: ./src/HiCommit-Server
    env_file:
      - ./src/HiCommit-Server/.env
    ports:
      - "5174:5174"
    environment:
      DB_HOST: db
      CLIENT_URL: ${CLIENT_URL}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5174/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ./src/HiCommit-Client
      secrets:
        - client_env
    ports:
      - "8081:80"
    depends_on:
      server:
        condition: service_healthy

secrets:
  client_env:
    file: ./src/HiCommit-Client/.env

volumes:
  hicommit_db_data:
    external: true
    name: hicommit_db_data
